[package]
name = "hypercurl"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/al8n/hypercurl"
documentation = "https://docs.rs/hypercurl"
description = "A template for creating Rust open-source repo on GitHub"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
keywords = ["template"]
categories = ["no-std", "no-std::no-alloc"]
exclude = ["/.github/", "/ci/", "/.codecov.yml", "/deny.toml"]

[features]
default = ["std"]
std = ["thiserror/std", "serde?/default"]
alloc = ["serde?/alloc"]

[dependencies]
derive_more = { version = "2", default-features = false, features = ["is_variant", "display", "unwrap", "try_unwrap"] }

serde = { version = "1", optional = true, default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }


[dev-dependencies]
criterion = "0.8"

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

# Without `bench = false`, `cargo bench` also builds the lib under libtest's bench harness, which
# is not what the `[[bench]]` target below, or `-- --test` in `perf.yml`, is for.
[lib]
bench = false

[[bench]]
path = "benches/foo.rs"
name = "foo"
harness = false

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
