[package]
name = "hypercurl"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/al8n/hypercurl"
documentation = "https://docs.rs/hypercurl"
description = "A template for creating Rust open-source repo on GitHub"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
keywords = ["template"]
categories = ["no-std", "no-std::no-alloc"]
exclude = ["/.github/", "/ci/", "/.codecov.yml", "/deny.toml", "/postman/"]

[features]
default = []

serde = ["dep:serde", "smol_str/serde", "alloy-primitives/serde", "jiff/serde"]
strict-serde = ["serde"]

reqwest = ["dep:reqwest", "serde"]
ureq = ["dep:ureq", "serde"]

[dependencies]
alloy-primitives = { version = "1.7" }
derive_more = { version = "2", default-features = false, features = ["is_variant", "display", "unwrap", "try_unwrap"] }
smol_str = "0.3"

jiff = { version = "1" }
reqwest = { version = "0.13", optional = true, features = ["json"] }
ureq = { version = "3", optional = true, features = ["json"] }

serde = { version = "1", optional = true, features = ["derive"] }
thiserror = "2"


[dev-dependencies]
criterion = "0.8"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

# Without `bench = false`, `cargo bench` also builds the lib under libtest's bench harness, which
# is not what the `[[bench]]` target below, or `-- --test` in `perf.yml`, is for.
[lib]
bench = false

[[bench]]
path = "benches/foo.rs"
name = "foo"
harness = false

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
